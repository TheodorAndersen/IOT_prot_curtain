# MQTT broker for the USB link of the USB/TTN switch (docker-compose service "mosquitto").
#   backend    -> mqtt://mosquitto:1883      (inside Docker only)
#   USB bridge -> nginx /mqtt -> ws://mosquitto:9001   (wss://<DOMAIN>/mqtt in production)
# Neither port is published on the host. entrypoint.sh puts the login and topic rules in front of this
# file: no login by default, or USB_MQTT_USERNAME / USB_MQTT_PASSWORD from .env; curtain topics only.

# Nothing worth keeping: the backend re-publishes the link and the bridge its status on every connect.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883
protocol mqtt

listener 9001
protocol websockets
